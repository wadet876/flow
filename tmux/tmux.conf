# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save pane text as part of resurrect snapshots.
set -g @resurrect-capture-pane-contents 'on'

# Continuum autosaves every 15 minutes and restores when a new tmux server starts.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Continuum uses tmux status hooks for background saves.
set -g status on

# Move the current window left/right in the window list.
# This terminal strips modifiers from arrow keys, so these need the prefix.
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1

# Pass 24-bit color through so nvim themes render as written.
set -as terminal-features ",xterm*:RGB:256"

# Keep PuTTY in normal cursor-key mode; in application mode it drops
# Shift/Ctrl from the arrow keys.
set -ga terminal-overrides ",xterm*:smkx@:rmkx@"

# prefix + a toggles a popup holding a grouped view (<session>-pop) of the
# current session: same windows, its own current window, kept when hidden.
# display-popup does not expand #{...} in its command, so go through run-shell.
bind-key a if-shell -F "#{m:*-pop,#{session_name}}" "detach-client" "run-shell -b 'tmux display-popup -c #{q:client_name} -E -w 50% -h 85% -d #{q:pane_current_path} \"~/scripts/tmux-pop #{q:session_name}\"'"

# Keep TPM initialization at the bottom.
run '~/.tmux/plugins/tpm/tpm'
